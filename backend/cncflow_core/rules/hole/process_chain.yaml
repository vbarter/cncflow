# 孔工艺链生成规则（后置生产层）
# 来源：《1、孔是否可加工_加工工艺图》模块二 Step1~9 + 《2-给定工艺链…SKU范围》速查表
# 区间约定：min 含、max 不含，除非标注 exclusive/inclusive
version: 1

# 基础钻孔只选一道主工序；D<1 的微孔工艺替代普通钻削
primary_drill:
  u_drill_min_d: 30              # D>30 → U钻（exclusive）
  micro_hole_max_d: 1            # D<1 → 微孔 EDM / 超高速钻削（exclusive）

# Step2 点钻添加判定（触发任一条件即添加，作为第一道工序）
spot_drill_triggers:
  surfaces: [inclined, curved]   # 倾斜面、曲面
  max_diameter: 3                # 小孔 D<3
  max_tolerance_it: 7            # 高精度定位 IT≤7，即 tolerance_it <= 7
  materials: [不锈钢, 钛合金]      # 易跑偏材质

# 冻结深径比 R01–R04：<5 普通钻；5~10 G83；>10~20 枪钻；>20 特种/EDM
deep_hole:
  g83_min_hd: 5                  # H/D≥5（inclusive）→ 深孔钻 + G83
  gun_drill_min_hd: 10           # H/D>10（exclusive）→ 枪钻
  gun_drill_max_hd: 20           # H/D≤20（inclusive）允许枪钻；更深必须走特种/EDM

# G83 每次啄深（钻削循环切换边界服从上面的冻结深径比分档）
drill_cycle:
  g83_peck_depth_mm: "5~10"      # G83 每次啄深

# F01–F09 精加工单选（位于基础钻孔之后、螺纹之前）
finishing:
  default_ra: 3.2                 # 未提供 Ra 按 3.2；默认孔不被强制精加工
  micro_hole_max_d: 1             # F01: D<1 → 主工序已含 EDM，禁用镗/铰
  deep_grind_min_hd: 10           # F02: H/D>10 且 IT≤6 → 磨削/珩磨
  deep_grind_max_it: 6
  grind_max_ra: 0.4               # F03: Ra≤0.4 → 磨削
  bore_min_d: 20                   # F04: D≥20 且 IT≤7 → 半精镗→精镗
  bore_max_it: 7
  fine_bore_max_it: 7             # F05: D<20、IT≤7、Ra≤0.8 → 精镗
  fine_bore_max_ra: 0.8
  ream_min_ra: 0.8                # F06: D<20、IT≤7、0.8<Ra≤1.6 → 铰孔
  ream_max_ra: 1.6
  semi_bore_it: 8                 # F07: IT=8 → 仅半精镗
  no_finish_min_it: 8             # F08: IT>8 且 Ra≥3.2 → 无精加工
  no_finish_min_ra: 3.2

# 螺纹加工工艺判定（位于精加工之后、修底之前）
thread:
  tap_max_d: 16                  # D≤16 常规螺纹 → 攻牙
  thread_mill_materials: [不锈钢]  # 不锈钢 → 螺纹铣
  thread_mill_min_hd: 5          # 深孔螺纹 → 螺纹铣

# 修底（盲孔平底 → 立铣刀；冻结在精加工和螺纹之后）
bottom:
  flat_requires_mill: true

# 辅助工序：所有孔完工后倒角（去锐边、防划伤，最终阶段）
chamfer_always: true

# 工序 → 循环指令映射（文档4 §5.2）
cycles:
  ream: G85
  rough_bore: G86
  semi_bore: G86
  fine_bore: G76

# 超大孔（D>80，文档1 §1.2.3）：常规立加不可钻，以粗镗替代基础钻孔
# 后续半精镗/精镗仍由 F01–F09 决定，避免 IT>8 绕过 F08。
large_hole:
  min_d: 80                      # exclusive
  primary: rough_bore
