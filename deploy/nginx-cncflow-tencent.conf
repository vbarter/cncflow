# Tencent VPS static frontend pilot. Keep this server block independent from
# magicart and the existing overseas cncflow deployment.
server {
    listen 8081;
    server_name 43.129.175.172;

    root /var/www/cncflow;
    index index.html;
    client_max_body_size 150m;

    location /api/ {
        proxy_pass https://cncflow-api.yzcaijunjie6095.workers.dev;
        proxy_http_version 1.1;

        proxy_ssl_server_name on;
        proxy_ssl_name cncflow-api.yzcaijunjie6095.workers.dev;
        proxy_set_header Host cncflow-api.yzcaijunjie6095.workers.dev;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
