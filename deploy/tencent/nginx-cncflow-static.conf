# cncflow static frontend on Tencent VPS — listen 8081 only.
# Do NOT bind 80/443 (magicart) or 8080.
# Public URL: http://43.129.175.172:8081/
#
# /api is same-origin reverse-proxied to the Cloudflare Worker.
# Flask / LLM / parser / R2 stay on Cloudflare. This vhost serves Vite dist only.

server {
    listen 8081 default_server;
    server_name 43.129.175.172 _;

    root /var/www/cncflow;
    index index.html;

    client_max_body_size 150m;

    # Hashed Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Same-origin API → Cloudflare Worker (chat is streamed; do not buffer)
    location /api/ {
        proxy_pass https://cncflow-api.yzcaijunjie6095.workers.dev/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name cncflow-api.yzcaijunjie6095.workers.dev;
        proxy_set_header Host cncflow-api.yzcaijunjie6095.workers.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hash-router SPA; fallback keeps a refresh on / from 404ing if index is missing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
